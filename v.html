<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Toolkit — Media Dibagikan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .viewer-wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; position: relative; z-index: 2; }
  .viewer-brand { text-align: center; color: var(--text-dim); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 18px; }
  .viewer-card { background: var(--glass-fill); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 16px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .viewer-media { width: 100%; border-radius: 20px; display: block; background: #000; max-height: 70vh; object-fit: contain; }
  .viewer-name { margin: 16px 4px 0; font-size: 14px; color: var(--text-dim); overflow-wrap: anywhere; }
  .viewer-actions { display: flex; gap: 10px; margin-top: 16px; }
  .viewer-actions a { flex: 1; }
  .viewer-error { text-align: center; color: var(--text-dim); padding: 60px 20px; }
</style>
</head>
<body>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="viewer-wrap">
    <p class="viewer-brand">Toolkit</p>
    <div id="content"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get("u");
    const name = params.get("n") || "file";
    const type = params.get("t") || "";
    const content = document.getElementById("content");

    if (!url) {
      content.innerHTML = '<div class="viewer-error">Link ini gak valid atau sudah gak lengkap.</div>';
    } else {
      let mediaEl;
      if (type.startsWith("video/")) {
        mediaEl = `<video class="viewer-media" src="${url}" controls playsinline></video>`;
      } else {
        mediaEl = `<img class="viewer-media" src="${url}" alt="${name.replace(/"/g, "&quot;")}" />`;
      }
      content.innerHTML = `
        <div class="viewer-card">
          ${mediaEl}
          <p class="viewer-name">${name.replace(/</g, "&lt;")}</p>
          <div class="viewer-actions">
            <a class="action-btn" href="${url}" download="${name.replace(/"/g, "&quot;")}">Download</a>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
