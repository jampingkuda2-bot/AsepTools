name: Build AsepTools APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download PDF.js
        run: |
          mkdir -p www/lib
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o www/lib/pdf.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o www/lib/pdf.worker.min.js

      - name: Download Twemoji
        run: |
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js -o www/lib/twemoji.min.js
          mkdir -p www/lib/twemoji/svg
          EMOJIS="1f6e0 1f4c1 1f4c2 1f4c4 1f4c5 1f4c6 1f4cb 1f4dd 1f4d6 1f4d5 1f4d7 1f4d8 1f4d9 1f4ca 1f4bb 1f4be 1f4e4 1f4e5 1f4e6 1f504 1f50d 1f512 1f513 1f527 1f510 1f5bc 1f5d1 1f5dc 1f3a8 1f3ac 1f3b5 1f40d 1f44d 1f4cd 1f7e3 2699 2b05 2b06 22ee 21a9 25c0 25b6 2212 2705 274c 26a0 2615"
          for code in $EMOJIS; do
            curl -sL "https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/svg/${code}.svg" -o "www/lib/twemoji/svg/${code}.svg" || true
          done
          echo "SVG count:"
          ls www/lib/twemoji/svg/ | wc -l

      - name: Tambah platform Android
        run: npx cap add android

      - name: Inject permission ke AndroidManifest
        run: |
          python3 << 'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
          '''
          content = content.replace('</manifest>', perms + '</manifest>')
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Sync web assets
        run: npx cap sync

      - name: Build APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsepTools-Debug
          path: android/app/build/outputs/apk/debug/*.apk
