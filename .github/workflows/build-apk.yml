name: Build AsepTools APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download PDF.js
        run: |
          mkdir -p www/lib
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o www/lib/pdf.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o www/lib/pdf.worker.min.js

      - name: Tambah platform Android
        run: npx cap add android

      - name: Inject permission ke AndroidManifest
        run: |
          python3 << 'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
          '''
          content = content.replace('</manifest>', perms + '</manifest>')
          with open(path, 'w') as f:
              f.write(content)
          print('Permissions injected')
          PYEOF
          echo "=== Verifikasi Manifest ==="
          grep "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync

      - name: Build APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsepTools-Debug
          path: android/app/build/outputs/apk/debug/*.apk
